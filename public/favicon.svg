<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two of the map's inks, overprinted: where they overlap they make a third colour. -->
  <rect width="32" height="32" rx="7" fill="#f4efe3"/>
  <clipPath id="pink"><circle cx="12.6" cy="13.2" r="8.9"/></clipPath>
  <circle cx="12.6" cy="13.2" r="8.9" fill="#ff48b0"/>
  <circle cx="19.6" cy="18.8" r="8.9" fill="#2864ba"/>
  <circle cx="19.6" cy="18.8" r="8.9" fill="#2a1d84" clip-path="url(#pink)"/>
</svg>
