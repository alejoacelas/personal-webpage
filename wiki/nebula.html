<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03040b">
<title>Alejo Acelas</title>
<link rel="icon" href="../public/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="nebula.css">
</head>
<body class="nebula">
<canvas id="map" aria-label="A map of every work, drawn as a night sky. The same works are listed under Read everything as a list."></canvas>
<div class="grain" aria-hidden="true"></div>
<header class="plate" id="plate"></header>
<div class="zoom" role="group" aria-label="Zoom">
  <button data-zoom="in" title="Zoom in (+)">+</button>
  <button data-zoom="out" title="Zoom out (−)">−</button>
  <button data-zoom="fit" title="See the whole map (0)">⤢</button>
</div>
<p class="hint">Scroll to zoom · drag to move</p>
<aside class="reader" id="reader" aria-live="polite" hidden></aside>
<div id="pop" role="tooltip" hidden></div>
<script src="data.js"></script>
<script src="map-nebula.js"></script>
<script src="app.js"></script>
</body>
</html>
