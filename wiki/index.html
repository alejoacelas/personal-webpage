<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alejo Acelas</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap&text=%23%C2%B6%7B%7D%E2%86%97%E2%80%9C%C2%B7">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="inks.css">
</head>
<body class="inks">
<canvas id="map" aria-label="A map of every work. The same works are listed under Read it as a list."></canvas>
<div class="grain" aria-hidden="true"></div>
<header class="plate" id="plate"></header>
<div class="zoom" role="group" aria-label="Zoom">
  <button data-zoom="in" title="Zoom in (+)">+</button>
  <button data-zoom="out" title="Zoom out (−)">−</button>
  <button data-zoom="fit" title="See the whole map (0)">⤢</button>
</div>
<p class="hint">Scroll to zoom · drag to move</p>
<aside class="reader" id="reader" aria-live="polite" hidden></aside>
<div id="pop" role="tooltip" hidden></div>
<script src="data.js"></script>
<script src="map-inks.js"></script>
<script src="app.js"></script>
</body>
</html>
