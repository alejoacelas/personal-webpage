<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alejo Acelas</title>
<link rel="icon" href="../public/favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="name" href="#/">Alejo Acelas</a>
  <nav class="lenses" aria-label="Arrange the works by"><span class="lenses-label">Arrange by</span><span id="lenses"></span></nav>
